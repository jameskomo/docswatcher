name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: benchmark corpus, performance budget, native builds

jobs:
  java:
    name: Java engine, CLI, app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: docswatcher, POSTGRES_USER: docswatcher, POSTGRES_DB: docswatcher }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          cache: maven
      # The wrapper downloads Maven itself, once, with no retry: a short Maven Central outage
      # failed the whole nightly run on 2026-09-24. Fetch it here, a few times if need be.
      - name: Fetch Maven
        run: for _ in 1 2 3; do ./mvnw -q -v && exit 0; sleep 30; done; exit 1
      - name: Build and test
        run: ./mvnw -B verify
      - name: Validate knowledge base
        run: java -jar cli/target/docswatcher-cli.jar validate knowledge

  web:
    name: Web, TypeScript engine, parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Two-engine parity
        run: npm run parity
        working-directory: web
      - run: npm run generate
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: web

  relay:
    name: Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm test
        working-directory: relay
      - run: npm test
        working-directory: notify

  gitlab-template:
    name: GitLab CI template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Runs the template's script under dash and bash against a fake release: good, tampered,
      # missing entry, and every way a report can be unreadable.
      - run: python3 -c "import yaml" 2>/dev/null || pip install pyyaml
      - run: python3 ci/gitlab/test_template.py

  nightly:
    name: Nightly native builds and performance budget
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with: { java-version: "25", distribution: graalvm-community, cache: maven }
      # The wrapper downloads Maven itself, once, with no retry: a short Maven Central outage
      # failed the whole nightly run on 2026-09-24. Fetch it here, a few times if need be.
      - name: Fetch Maven
        run: for _ in 1 2 3; do ./mvnw -q -v && exit 0; sleep 30; done; exit 1
      - name: Performance budget
        run: ./mvnw -B -pl engine -am verify -Dgroups=nightly -DexcludedGroups=fuzz
      - name: Native CLI
        run: ./mvnw -B -Pnative -pl cli -am package -DskipTests
      - name: Native app
        run: ./mvnw -B -Pnative -pl app -am package -DskipTests

  # CI was red for three days and nobody noticed. No commit had broken it: knowledge records had
  # passed their effective dates while still marked active, and the validator rightly failed on
  # them. Only the nightly run catches a failure that comes from the date, and a failing scheduled
  # run is easy to miss. This job keeps one rolling issue open while the nightly run fails, and
  # closes it when the nightly run passes again. It reports and never fails itself: the run's
  # status still comes from the jobs above.
  nightly-alert:
    name: Nightly failure alert
    # always(): without it, a failed job above would skip this one, which is the very case it is for.
    if: always() && github.event_name == 'schedule'
    needs: [java, web, relay, gitlab-template, nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A skipped job did not fail: it only did not apply to this run. A failed or cancelled
          # job means the nightly result cannot be trusted.
          failed=$(echo "$NEEDS" | jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | "- `\(.key)`: \(.value.result)"')
          title="Nightly CI is failing"
          today=$(date -u +%F)
          existing=$(gh issue list --label ci-nightly --state open \
            --json number,title --jq '[.[] | select(.title == "Nightly CI is failing")][0].number // empty')
          if [ -n "$failed" ]; then
            printf 'Failed jobs:\n%s\n' "$failed"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$(printf 'Still failing on %s: %s\n\n%s\n' "$today" "$RUN_URL" "$failed")"
              echo "commented on the rolling issue #$existing"
            else
              gh label create ci-nightly --color B60205 \
                --description "The nightly CI run is failing" --force >/dev/null
              {
                echo "The nightly CI run failed on $today: $RUN_URL"
                echo
                echo "$failed"
                echo
                echo "A nightly failure that no commit explains comes from something outside the repository:"
                echo "a dependency, a runner image, or a test that reads today's date. A record passing its"
                echo "effective date is not one of them; since 2026-10-09 that is a warning, never a failure."
                echo "Open the failed job above for the cause."
                echo
                echo "Each further failing night adds a comment here. The issue closes itself when the nightly run passes."
              } > "$RUNNER_TEMP/issue.md"
              gh issue create --label ci-nightly --title "$title" --body-file "$RUNNER_TEMP/issue.md"
            fi
          elif [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The nightly run is passing again on $today: $RUN_URL"
            gh issue close "$existing"
            echo "closed the rolling issue #$existing"
          else
            echo "The nightly run passed and no issue is open."
          fi
