name: Security audit

# A scheduled, agent-driven audit of this repository.
#
# It is deliberately not part of the per-push CI. The audit orchestrates many
# agents and costs real tokens, so it runs on a cadence and on demand, never on
# every commit. The workflow fails only when the audit itself cannot complete;
# findings are reported as an issue, because a finding needs a human decision
# rather than a red build.

on:
  schedule:
    # Mondays at 04:00 UTC, before the working week.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: "Audit breadth"
        required: false
        default: standard
        type: choice
        options: [quick, standard, deep]

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Is this audit configured to run?
        id: gate
        env:
          # Either credential works. A subscription token (`claude setup-token`)
          # bills the Claude plan and spends no API credit; an API key bills
          # prepaid API credit. Prefer the token.
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${TOKEN}${KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Security audit skipped"
              echo
              echo "Neither \`CLAUDE_CODE_OAUTH_TOKEN\` nor \`ANTHROPIC_API_KEY\` is set on this"
              echo "repository, so there is nothing to run. This is a deliberate state, not a"
              echo "fault: the audit spends real tokens on every run."
              echo
              echo "To enable it: \`claude setup-token\`, then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN\`."
              echo "To run it without paying for a schedule: remove the \`schedule:\` trigger and use"
              echo "the **Run workflow** button when you want one."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Security audit skipped: no Claude credential is set"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.configured == 'true' 
        with:
          fetch-depth: 0
          # Do not write the job token into .git/config as an http extraheader.
          # Nothing in this workflow pushes, and the install step below runs
          # third-party code in the same job.
          persist-credentials: false

      - name: Install the audit skill
        if: steps.gate.outputs.configured == 'true'
        env:
          # Pinned to the commit this workflow was reviewed against. A branch name
          # here would let whoever can push to that repository choose the code this
          # job runs, in the job that holds the Claude credential and issues: write.
          # Bump it deliberately, the way any other dependency is bumped.
          SKILL_REPO: https://github.com/cloudflare/security-audit-skill
          SKILL_SHA: c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
        run: |
          set -euo pipefail
          mkdir -p ~/.claude/skills /tmp/sas
          git -C /tmp/sas init -q
          git -C /tmp/sas remote add origin "$SKILL_REPO"
          git -C /tmp/sas fetch -q --depth 1 origin "$SKILL_SHA"
          git -C /tmp/sas checkout -q FETCH_HEAD
          test "$(git -C /tmp/sas rev-parse HEAD)" = "$SKILL_SHA"
          cp -r /tmp/sas/skills/security-audit ~/.claude/skills/
          # The upstream project's own unit tests are not ours to run. Executing
          # them here was arbitrary third-party code execution in a privileged job
          # and bought this repository nothing.

      - name: Run the audit
        if: steps.gate.outputs.configured == 'true'
        uses: anthropics/claude-code-action@b949468893d8bba436c9c71ea860b1f5f344804e # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the action mints a Claude GitHub App token over OIDC,
          # which needs `id-token: write` and the app installed. This job only
          # reads a checkout and writes files to disk, so the job token is both
          # sufficient and the smaller grant.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The skill reads the tree, runs its own sub-agents and writes a report.
          # Without this the default policy denies those calls: the first run
          # finished "successfully" with 15 permission denials and no report.
          # Read-and-write within the workspace only; no network fetch tools.
          # Skill is what loads the audit workflow at all; Task is what lets it
          # delegate. The network fetch tools are deliberately absent: this job
          # reads our own source and has no reason to reach outward.
          claude_args: >-
            --allowed-tools Skill,Read,Glob,Grep,Bash,Write,Edit,Task,TodoWrite
          prompt: |
            Run the security-audit skill against this repository in FULL AUDIT
            MODE: all six phases, artifacts written to disk. The skill treats
            itself as guidance unless a full audit is explicitly requested, so
            treat this as that explicit request.

            This is a non-interactive CI run. Do not ask a clarifying question:
            there is nobody to answer it, and a question ends the run with no
            report. Where the skill says to ask, choose the more conservative
            reading and record the choice in the report.

            Profile: ${{ inputs.profile || 'standard' }}.

            Create ./security-audit-output and write the run under it, including
            run-metadata.json, findings.json and REPORT.md. The workflow fails if
            REPORT.md is absent, so produce it even when nothing is confirmed.

            Source inspection only. Do not execute target-controlled code: this
            runner cannot enforce the sandbox the skill requires, so record any
            check that would need it as needs_validation with that blocker.

      # Full agent output is hidden in the log, so when the audit writes nothing
      # this is the only evidence of what it did produce.
      - name: What did the audit write?
        if: always() && steps.gate.outputs.configured == 'true'
        run: ls -laR security-audit-output 2>&1 | head -60 || echo "no security-audit-output directory"

      - name: Publish a summary
        if: always() && steps.gate.outputs.configured == 'true' 
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'security-audit-output';
            if (!fs.existsSync(dir)) {
              core.setFailed('The audit produced no artifacts.');
              return;
            }
            const run = fs.readdirSync(dir).sort().pop();
            const read = (f) => { try { return fs.readFileSync(`${dir}/${run}/${f}`, 'utf8'); } catch { return ''; } };
            if (!read('REPORT.md')) { core.setFailed('The audit produced no REPORT.md.'); return; }

            // COUNTS ONLY. This repository is public, so an issue body is world-readable the
            // moment it is created. The report carries file paths, traces, line numbers and
            // reproduction steps for findings nobody has fixed yet; publishing that on a
            // schedule hands an attacker a worked example before the maintainer has read it.
            // The detail stays on the machine that ran the audit.
            let counts = {};
            try {
              for (const r of JSON.parse(read('findings.json'))) {
                if (r.verdict !== 'confirmed') continue;
                const s = r.severity?.overall_severity ?? 'unrated';
                counts[s] = (counts[s] ?? 0) + 1;
              }
            } catch { /* the summary still gets published */ }

            const order = ['critical', 'high', 'medium', 'low', 'informational'];
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            const rows = order.filter(s => counts[s]).map(s => `| ${s} | ${counts[s]} |`).join('\n');
            const title = `Security audit ${new Date().toISOString().slice(0, 10)}: ${total} confirmed`;
            const body = [
              rows ? `| severity | confirmed |\n|---|---|\n${rows}` : 'No confirmed findings.',
              '',
              'Detail is deliberately withheld. This repository is public, so anything in this',
              'issue is readable by anyone, and the report names exact files, lines and',
              'reproduction steps for findings that are not fixed yet.',
              '',
              `To read it, re-run the audit locally: \`gh workflow run security-audit.yml\` is`,
              'not enough, because the artifacts are not retained either. Run the security-audit',
              'skill against a local checkout and read REPORT.md there.',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title, body, labels: ['security'] });

      # No artifact upload. On a public repository an Actions artifact is downloadable by
      # anyone, so retaining REPORT.md and NEEDS-VALIDATION.md there leaks exactly what the
      # summary above withholds. If this repository is ever made private, or the artifacts are
      # sent somewhere access-controlled, restore the upload-artifact step from git history.
