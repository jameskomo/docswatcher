# Local stack: Postgres plus the app on the JVM.
# Build the app image first:  ../mvnw -pl app spring-boot:build-image -DskipTests
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docswatcher
      POSTGRES_USER: docswatcher
      POSTGRES_PASSWORD: docswatcher
    ports:
      - "5432:5432"
    volumes:
      - docswatcher-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docswatcher"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: app:0.1.0-SNAPSHOT
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOCSWATCHER_DB_URL: jdbc:postgresql://db:5432/docswatcher
      DOCSWATCHER_DB_USER: docswatcher
      DOCSWATCHER_DB_PASSWORD: docswatcher
      DOCSWATCHER_API_TOKEN: ${DOCSWATCHER_API_TOKEN:-dev-token}
      DOCSWATCHER_WEB_ORIGIN: ${DOCSWATCHER_WEB_ORIGIN:-http://localhost:3000}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"

volumes:
  docswatcher-db:
