docswatcher:
  engine:
    enabled: false
  github:
    app-id: ""
    webhook-secret: test-secret
    # Sign-in. GitHubUserMock answers for both hosts, so nothing leaves the JVM.
    client-id: Iv23test
    client-secret: oauth-test-secret
    web-base: https://github.test
    api-base: https://api.github.test
  gitlab:
    # GitLabMock answers for this host, so nothing leaves the JVM.
    base-url: https://gitlab.test
    client-id: gitlab-test-client
    client-secret: gitlab-oauth-test-secret
    # Bytes 0 to 31. A test key, and only ever one.
    token-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  api:
    token: test-token
    require-token: true
  web:
    origin: https://docswatcher.test
  worker:
    enabled: false
  # Tests run the alert job themselves, as of the day they choose.
  alerts:
    cron: "-"
  # The engine is off here (tests use a fake); a test of the scan process builds its own.
  scan:
    isolation: in-process
