spring:
  application:
    name: docswatcher
  config:
    # Secrets are read from files, not environment variables.
    #
    # An environment variable is visible to anything that can run docker inspect
    # or read /proc/<pid>/environ, and it is easy to leak into a log or a crash
    # report. Spring's config tree maps each file in this directory to the
    # property named by the file, so a Docker secret mounted as
    # /run/secrets/docswatcher.github.private-key becomes that property with no
    # code. Optional, so local development and the tests still run without it.
    import: "optional:configtree:/run/secrets/"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DOCSWATCHER_DB_URL:jdbc:postgresql://localhost:5432/docswatcher}
    username: ${DOCSWATCHER_DB_USER:docswatcher}
    password: ${DOCSWATCHER_DB_PASSWORD:docswatcher}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

docswatcher:
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    api-base: ${GITHUB_API_BASE:https://api.github.com}
    fix-label: docswatcher:fix
    snooze-label: docswatcher:snooze-30d
    not-in-prod-label: docswatcher:not-in-prod
  api:
    token: ${DOCSWATCHER_API_TOKEN:}
    require-token: true
  web:
    origin: ${DOCSWATCHER_WEB_ORIGIN:http://localhost:3000}
  knowledge:
    dir: ${DOCSWATCHER_KNOWLEDGE_DIR:}
  worker:
    enabled: true
    threads: 2
    poll-ms: 2000
    clone-timeout-seconds: 120

---
spring:
  config:
    activate:
      on-profile: dev
docswatcher:
  api:
    require-token: false
