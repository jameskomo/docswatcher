spring:
  application:
    name: docswatcher
  config:
    # Secrets are read from files, not environment variables.
    #
    # An environment variable is visible to anything that can run docker inspect
    # or read /proc/<pid>/environ, and it is easy to leak into a log or a crash
    # report. Spring's config tree maps each file in this directory to the
    # property named by the file, so a Docker secret mounted as
    # /run/secrets/docswatcher.github.private-key becomes that property with no
    # code. Optional, so local development and the tests still run without it.
    import: "optional:configtree:/run/secrets/"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DOCSWATCHER_DB_URL:jdbc:postgresql://localhost:5432/docswatcher}
    username: ${DOCSWATCHER_DB_USER:docswatcher}
    password: ${DOCSWATCHER_DB_PASSWORD:docswatcher}
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

docswatcher:
  github:
    app-id: ${GITHUB_APP_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    api-base: ${GITHUB_API_BASE:https://api.github.com}
    # Sign-in with GitHub (docs/adr/0008-sign-in-with-github.md): the App's OAuth client.
    # The id is public. The secret belongs in /run/secrets/docswatcher.github.client-secret,
    # which the config tree above maps onto this property and which wins over the variable.
    # Either one blank: sign-in answers 503 and the dashboard offers only the browser scan.
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    web-base: ${GITHUB_WEB_BASE:https://github.com}
    session-ttl: 8h
    fix-label: docswatcher:fix
    snooze-label: docswatcher:snooze-30d
    not-in-prod-label: docswatcher:not-in-prod
    not-affected-label: docswatcher:not-affected
  # GitLab (docs/adr/0012-gitlab.md): one instance, gitlab.com or self-managed. Sign-in needs the
  # OAuth application's id and secret; connecting groups needs the token key, base64 of 32 random
  # bytes that encrypts the groups' access tokens. Both secrets belong in /run/secrets/
  # (docswatcher.gitlab.client-secret, docswatcher.gitlab.token-key), which win over the variables.
  gitlab:
    base-url: ${GITLAB_BASE_URL:https://gitlab.com}
    client-id: ${GITLAB_CLIENT_ID:}
    client-secret: ${GITLAB_CLIENT_SECRET:}
    token-key: ${DOCSWATCHER_GITLAB_TOKEN_KEY:}
    session-ttl: 8h
  api:
    token: ${DOCSWATCHER_API_TOKEN:}
    require-token: true
  web:
    origin: ${DOCSWATCHER_WEB_ORIGIN:http://localhost:3000}
  # Where early-access requests are emailed from (the notify/ worker). Both unset: stored, not sent.
  notify:
    url: ${DOCSWATCHER_NOTIFY_URL:}
    token: ${DOCSWATCHER_NOTIFY_TOKEN:}
  # Customer email: team alerts and public subscriptions (docs/adr/0010-alerts-before-the-date.md).
  # The key belongs in /run/secrets/docswatcher.brevo.api-key; BREVO_API_KEY is for local runs.
  # Blank: the app starts, says email alerts are off, and sends Slack alerts only.
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${DOCSWATCHER_ALERTS_FROM:alerts@vukisha.co.ke}
    sender-name: DocsWatcher
    daily-limit: 300
  alerts:
    # When the daily alert job runs, in UTC. "-" turns it off.
    cron: "0 0 6 * * *"
  knowledge:
    dir: ${DOCSWATCHER_KNOWLEDGE_DIR:}
  worker:
    enabled: true
    threads: 2
    poll-ms: 2000
    clone-timeout-seconds: 120
  # Whole-scan limits (ScanLimitsProperties). A scan that reaches one stops reading, is recorded as
  # incomplete, closes nothing, and says so in its check run.
  scan:
    max-files: 20000
    max-total-mb: 200
    max-seconds: 600
    # Where scans run (ScanIsolationProperties, docs/adr/0011-scans-in-their-own-process.md).
    # process: each scan in a JVM of its own, started from this app's own jar, so a parser crash or
    # a runaway scan ends that process and fails that run, never the web server. It costs a process
    # start per scan (about 0.6 to 1.5 s). in-process: in this JVM, as before.
    isolation: ${DOCSWATCHER_SCAN_ISOLATION:process}
    process:
      heap-mb: 1024
      # Unset: max-seconds plus 60 s. Past it the scan process is killed and the run fails.
      # timeout-seconds: 660
      # jvm-options: []
    # Unset: the scan timeout plus two clone timeouts plus ten minutes. A run still running after
    # that was left by a process that stopped; it is failed and queued again once.
    # reclaim-after-seconds: 1500

---
spring:
  config:
    activate:
      on-profile: dev
docswatcher:
  api:
    require-token: false
