id: linkedin-version-202401-sunset-2025
provider: linkedin
kind: sunset
severity: breaking
title: "Marketing API version 202401 sunset"
summary: >
  Marketing API version 202401 (January 2024) was sunset on 2025-01-22. LinkedIn
  returns an error response to a request whose Linkedin-Version header names a
  sunset version, so every call pinned to 202401 fails from that date.

affects:
  - kind: api_version
    match: "202401"

announced: 2024-01-01
effective: 2025-01-22

sources:
  - kind: provider_page
    url: https://learn.microsoft.com/en-us/linkedin/marketing/integrations/migrations
    observed: 2026-09-24
    note: "API Migration Status: \"Developers using LinkedIn Marketing APIs version 202401 (January 2024) to migrate to the latest versions.\" Sunset date January 22, 2025. announced is the version's release month; LinkedIn publishes versions by month, not by day."
  - kind: provider_page
    url: https://learn.microsoft.com/en-us/linkedin/marketing/versioning
    observed: 2026-09-24
    note: "\"An error response is returned when the version header is deprecated\"; versions \"are supported and stable for a minimum of one year before sunset.\""

migration:
  replacement: "202609"
  guide: https://learn.microsoft.com/en-us/linkedin/marketing/versioning
  effort: medium
  notes: >
    Change the Linkedin-Version header value from 202401 to a supported
    version, ideally the latest, wherever it is set: request headers, client
    configuration and environment variables. Read the recent-changes page for
    every version between 202401 and the target, since resources, fields and
    pagination changed between versions. Do not remove the header to escape
    the pin: LinkedIn applies no default version and rejects a request that
    names none.

status: expired
