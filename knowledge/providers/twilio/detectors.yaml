provider: twilio

manifests:
  - ecosystem: npm
    package: twilio
  - ecosystem: pypi
    package: twilio
  - ecosystem: maven
    package: com.twilio.sdk:twilio
  - ecosystem: go
    package: github.com/twilio/twilio-go
  - ecosystem: rubygems
    package: twilio-ruby

literals:
  # Twilio splits products across subdomains and several of them expose the same
  # paths, so /v1/Services alone would be ambiguous between Notify, Chat and
  # Conversations. The captured key therefore carries the subdomain, giving keys
  # of the form "ANY /notify/v1/Services". This is a deliberate convention for
  # this provider rather than the bare request path used elsewhere.
  - id: twilio.literal.endpoint-product
    kind: endpoint
    files: ["**/*.{java,kt,ts,tsx,js,jsx,mjs,py,go,rb,php,cs,yaml,yml,toml,properties,env}"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**"]
    pattern: 'https://(notify|chat|ip-messaging|conversations|verify|video|sync)\.twilio\.com/(v[0-9]+(?:/[A-Za-z]+)*)'
    key: "ANY /$1/$2"
    confidence: medium

  - id: twilio.literal.endpoint-core
    kind: endpoint
    files: ["**/*.{java,kt,ts,tsx,js,jsx,mjs,py,go,rb,php,cs,yaml,yml,toml,properties,env}"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**"]
    pattern: 'https://api\.twilio\.com(/[0-9]{4}-[0-9]{2}-[0-9]{2}/[A-Za-z]+)'
    key: "ANY $1"
    confidence: medium

  # The core REST API is pinned by a dated path segment. The negative lookahead
  # stops a longer date-like string being truncated to a shorter match.
  - id: twilio.literal.api-version
    kind: api_version
    files: ["**/*"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**", "**/*.lock", "**/package-lock.json"]
    pattern: 'api\.twilio\.com/([0-9]{4}-[0-9]{2}-[0-9]{2})(?![0-9-])'
    key: "$1"
    confidence: medium

callsites:
  - id: twilio.python.messages-create
    language: python
    kind: sdk_method
    requires: twilio
    query: |
      (call
        function: (attribute
          object: (attribute attribute: (identifier) @a1)
          attribute: (identifier) @m)
        (#eq? @a1 "messages") (#eq? @m "create")) @call
    key: "messages.create"
    confidence: high

  - id: twilio.javascript.messages-create
    language: javascript
    kind: sdk_method
    requires: twilio
    query: |
      (call_expression
        function: (member_expression
          object: (member_expression property: (property_identifier) @a1)
          property: (property_identifier) @m)
        (#eq? @a1 "messages") (#eq? @m "create")) @call
    key: "messages.create"
    confidence: high
