id: youtube-search-related-to-video-id-removed-2023
provider: youtube
kind: field_change
severity: breaking
title: search.list relatedToVideoId parameter removed
summary: >
  YouTube stopped supporting the relatedToVideoId parameter of search.list on
  2023-08-07 and removed it from the documentation. The API offers no
  replacement for fetching videos related to a given video.

affects:
  - kind: sdk_method
    match: "search.list.relatedToVideoId"

announced: 2023-06-12
effective: 2023-08-07

sources:
  - kind: changelog
    url: https://developers.google.com/youtube/v3/revision_history
    observed: 2026-09-24
    note: "June 12, 2023: \"The search.list method's relatedToVideoId parameter has been deprecated. YouTube will stop supporting the parameter as of August 7, 2023.\" August 7, 2023: \"That parameter is no longer supported, and references to the parameter have been removed from the API documentation.\""

migration:
  replacement: null
  guide: https://developers.google.com/youtube/v3/docs/search/list
  effort: medium
  notes: >
    Remove relatedToVideoId from search.list requests; YouTube publishes no
    replacement and removed its related-videos example from the implementation
    guide. If the feature must stay, build the query another way, for example a
    search.list call with q set from the source video's title or tags
    (fetched with videos.list part=snippet), and say in the PR that results
    differ from YouTube's related videos. Delete code paths and tests that
    depend on related-video results.

status: expired
