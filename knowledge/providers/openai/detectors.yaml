provider: openai

manifests:
  - ecosystem: pypi
    package: openai
  - ecosystem: npm
    package: openai
  - ecosystem: maven
    package: com.openai:openai-java
  - ecosystem: go
    package: github.com/openai/openai-go
  - ecosystem: rubygems
    package: openai
  - ecosystem: rubygems
    package: ruby-openai
  - ecosystem: packagist
    package: openai-php/client
  - ecosystem: packagist
    package: openai-php/laravel
  - ecosystem: nuget
    package: OpenAI

literals:
  # text-embedding-* is not an OpenAI-only shape. Google ships
  # text-embedding-004, so a loose [0-9a-z-]+ tail claimed Gemini embeddings as
  # OpenAI contracts. Anchored to OpenAI's real families instead. Found by
  # scanning a repository that used both providers.
  - id: openai.literal.model-gpt
    kind: model
    files: ["**/*"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**", "**/*.lock", "**/package-lock.json"]
    pattern: '\b(gpt-(?:[0-9]|image|realtime|audio|transcribe|live)(?:[0-9a-z.-]*[0-9a-z])?|chatgpt-[0-9a-z.-]*[0-9a-z]|dall-e-[0-9]|whisper-[0-9]+|text-embedding-(?:ada-[0-9]{3}|[0-9]+-(?:small|large))|text-davinci-[0-9]{3}|babbage-002|davinci-002|sora-[0-9](?:[0-9a-z.-]*[0-9a-z])?)\b'
    key: "$1"
    confidence: medium

  - id: openai.literal.model-o-series
    kind: model
    files: ["**/*"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**", "**/*.lock", "**/package-lock.json"]
    pattern: '["''](o[134](?:-mini|-pro|-preview|-deep-research)?(?:-[0-9]{4}-[0-9]{2}-[0-9]{2})?)["'']'
    key: "$1"
    confidence: medium

  - id: openai.literal.endpoint
    kind: endpoint
    files: ["**/*.{java,kt,ts,tsx,js,jsx,mjs,py,go,rb,php,cs,yaml,yml,toml,properties,env}"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**"]
    pattern: 'https://api\.openai\.com(/v1/[a-z_]+(?:/[a-z_]+)*)'
    key: "ANY $1"
    confidence: medium

callsites:
  - id: openai.python.chat-completions-create
    language: python
    kind: sdk_method
    requires: openai
    query: |
      (call
        function: (attribute
          object: (attribute
            object: (attribute attribute: (identifier) @a1)
            attribute: (identifier) @a2)
          attribute: (identifier) @m)
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat.completions.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.python.assistants-create
    language: python
    kind: sdk_method
    requires: openai
    query: |
      (call
        function: (attribute
          object: (attribute
            object: (attribute attribute: (identifier) @a1)
            attribute: (identifier) @a2)
          attribute: (identifier) @m)
        (#eq? @a1 "beta") (#eq? @a2 "assistants") (#eq? @m "create")) @call
    key: "beta.assistants.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/assistants"
    confidence: high

  - id: openai.typescript.chat-completions-create
    language: typescript
    kind: sdk_method
    requires: openai
    query: |
      (call_expression
        function: (member_expression
          object: (member_expression
            object: (member_expression property: (property_identifier) @a1)
            property: (property_identifier) @a2)
          property: (property_identifier) @m)
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat.completions.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.javascript.chat-completions-create
    language: javascript
    kind: sdk_method
    requires: openai
    query: |
      (call_expression
        function: (member_expression
          object: (member_expression
            object: (member_expression property: (property_identifier) @a1)
            property: (property_identifier) @a2)
          property: (property_identifier) @m)
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat.completions.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.java.chat-completions-create
    language: java
    kind: sdk_method
    requires: com.openai:openai-java
    query: |
      (method_invocation
        object: (method_invocation
          object: (method_invocation name: (identifier) @a1)
          name: (identifier) @a2)
        name: (identifier) @m
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat().completions().create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  # Ruby: the official gem (openai) mirrors the Python client's resource paths;
  # the community gem ruby-openai takes one parameters: hash per method.
  - id: openai.ruby.chat-completions-create
    language: ruby
    kind: sdk_method
    requires: openai
    query: |
      (call
        receiver: (call
          receiver: (call method: (identifier) @a1)
          method: (identifier) @a2)
        method: (identifier) @m
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat.completions.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.ruby.assistants-create
    language: ruby
    kind: sdk_method
    requires: openai
    query: |
      (call
        receiver: (call
          receiver: (call method: (identifier) @a1)
          method: (identifier) @a2)
        method: (identifier) @m
        (#eq? @a1 "beta") (#eq? @a2 "assistants") (#eq? @m "create")) @call
    key: "beta.assistants.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/assistants"
    confidence: high

  - id: openai.ruby.ruby-openai-chat
    language: ruby
    kind: sdk_method
    requires: ruby-openai
    query: |
      (call
        receiver: (_)
        method: (identifier) @m
        arguments: (argument_list (pair key: (hash_key_symbol) @k))
        (#eq? @m "chat") (#eq? @k "parameters")) @call
    key: "chat"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.ruby.ruby-openai-assistants-create
    language: ruby
    kind: sdk_method
    requires: ruby-openai
    query: |
      (call
        receiver: (call method: (identifier) @a1)
        method: (identifier) @m
        arguments: (argument_list (pair key: (hash_key_symbol) @k))
        (#eq? @a1 "assistants") (#eq? @m "create") (#eq? @k "parameters")) @call
    key: "assistants.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/assistants"
    confidence: high

  # PHP: openai-php/client resources are methods ($client->chat()->create()).
  # The Laravel package exposes the same client through the OpenAI facade.
  - id: openai.php.chat-create
    language: php
    kind: sdk_method
    requires: openai-php/client
    query: |
      (member_call_expression
        object: (member_call_expression name: (name) @a1)
        name: (name) @m
        (#eq? @a1 "chat") (#eq? @m "create")) @call
    key: "chat()->create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.php.assistants-create
    language: php
    kind: sdk_method
    requires: openai-php/client
    query: |
      (member_call_expression
        object: (member_call_expression name: (name) @a1)
        name: (name) @m
        (#eq? @a1 "assistants") (#eq? @m "create")) @call
    key: "assistants()->create"
    maps_to:
      kind: endpoint
      key: "POST /v1/assistants"
    confidence: high

  - id: openai.php.laravel-chat-create
    language: php
    kind: sdk_method
    requires: openai-php/laravel
    query: |
      (member_call_expression
        object: (scoped_call_expression
          scope: [(name) @f (qualified_name (name) @f)]
          name: (name) @a1)
        name: (name) @m
        (#eq? @f "OpenAI") (#eq? @a1 "chat") (#eq? @m "create")) @call
    key: "OpenAI::chat()->create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.php.laravel-assistants-create
    language: php
    kind: sdk_method
    requires: openai-php/laravel
    query: |
      (member_call_expression
        object: (scoped_call_expression
          scope: [(name) @f (qualified_name (name) @f)]
          name: (name) @a1)
        name: (name) @m
        (#eq? @f "OpenAI") (#eq? @a1 "assistants") (#eq? @m "create")) @call
    key: "OpenAI::assistants()->create"
    maps_to:
      kind: endpoint
      key: "POST /v1/assistants"
    confidence: high

  # C#: the OpenAI package's clients are typed per API (ChatClient,
  # AssistantClient), so the method name alone identifies the endpoint.
  - id: openai.csharp.chat-complete-chat
    language: csharp
    kind: sdk_method
    requires: OpenAI
    query: |
      (invocation_expression
        function: (member_access_expression name: (identifier) @m)
        (#eq? @m "CompleteChat")) @call
      (invocation_expression
        function: (member_access_expression name: (identifier) @m)
        (#eq? @m "CompleteChatAsync")) @call
      (invocation_expression
        function: (member_access_expression name: (identifier) @m)
        (#eq? @m "CompleteChatStreaming")) @call
      (invocation_expression
        function: (member_access_expression name: (identifier) @m)
        (#eq? @m "CompleteChatStreamingAsync")) @call
    key: "ChatClient.CompleteChat"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.csharp.assistants-create
    language: csharp
    kind: sdk_method
    requires: OpenAI
    query: |
      (invocation_expression
        function: (member_access_expression name: (identifier) @m)
        (#eq? @m "CreateAssistant")) @call
      (invocation_expression
        function: (member_access_expression name: (identifier) @m)
        (#eq? @m "CreateAssistantAsync")) @call
    key: "AssistantClient.CreateAssistant"
    maps_to:
      kind: endpoint
      key: "POST /v1/assistants"
    confidence: high
