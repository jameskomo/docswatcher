provider: openai

manifests:
  - ecosystem: pypi
    package: openai
  - ecosystem: npm
    package: openai
  - ecosystem: maven
    package: com.openai:openai-java
  - ecosystem: go
    package: github.com/openai/openai-go

literals:
  # text-embedding-* is not an OpenAI-only shape. Google ships
  # text-embedding-004, so a loose [0-9a-z-]+ tail claimed Gemini embeddings as
  # OpenAI contracts. Anchored to OpenAI's real families instead. Found by
  # scanning a repository that used both providers.
  - id: openai.literal.model-gpt
    kind: model
    files: ["**/*"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**", "**/*.lock", "**/package-lock.json"]
    pattern: '\b(gpt-(?:[0-9]|image|realtime|audio|transcribe|live)(?:[0-9a-z.-]*[0-9a-z])?|chatgpt-[0-9a-z.-]*[0-9a-z]|dall-e-[0-9]|whisper-[0-9]+|text-embedding-(?:ada-[0-9]{3}|[0-9]+-(?:small|large))|text-davinci-[0-9]{3}|babbage-002|davinci-002|sora-[0-9](?:[0-9a-z.-]*[0-9a-z])?)\b'
    key: "$1"
    confidence: medium

  - id: openai.literal.model-o-series
    kind: model
    files: ["**/*"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**", "**/*.lock", "**/package-lock.json"]
    pattern: '["''](o[134](?:-mini|-pro|-preview|-deep-research)?(?:-[0-9]{4}-[0-9]{2}-[0-9]{2})?)["'']'
    key: "$1"
    confidence: medium

  - id: openai.literal.endpoint
    kind: endpoint
    files: ["**/*.{java,kt,ts,tsx,js,jsx,mjs,py,go,rb,php,cs,yaml,yml,toml,properties,env}"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**"]
    pattern: 'https://api\.openai\.com(/v1/[a-z_]+(?:/[a-z_]+)*)'
    key: "ANY $1"
    confidence: medium

callsites:
  - id: openai.python.chat-completions-create
    language: python
    kind: sdk_method
    requires: openai
    query: |
      (call
        function: (attribute
          object: (attribute
            object: (attribute attribute: (identifier) @a1)
            attribute: (identifier) @a2)
          attribute: (identifier) @m)
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat.completions.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.python.assistants-create
    language: python
    kind: sdk_method
