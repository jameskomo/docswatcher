          property: (property_identifier) @m)
        (#eq? @a1 "chat") (#eq? @a2 "completions") (#eq? @m "create")) @call
    key: "chat.completions.create"
    maps_to:
      kind: endpoint
      key: "POST /v1/chat/completions"
    confidence: high

  - id: openai.java.chat-completions-create
    language: java
    kind: sdk_method
    requires: com.openai:openai-java
    query: |
      (method_invocation
