id: openai-chatgpt-4o-latest-shutdown-2026
provider: openai
kind: retired
severity: breaking
title: "chatgpt-4o-latest shut down"
summary: >
  Requests to the model chatgpt-4o-latest fail after the shutdown date.
  OpenAI recommends gpt-5.1-chat-latest as the replacement.

affects:
  - kind: model
    match: "chatgpt-4o-latest"

announced: 2025-11-18
effective: 2026-02-17

sources:
  - kind: provider_page
    url: https://developers.openai.com/api/docs/deprecations
    observed: 2026-09-18

migration:
  replacement: "gpt-5.1-chat-latest"
  guide: https://developers.openai.com/api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Re-run any evals, because output style and
    token usage differ between model generations.

status: expired
