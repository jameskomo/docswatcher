id: openai-gpt-5-mini-2025-08-07-shutdown-2026
provider: openai
kind: retired
severity: breaking
title: "gpt-5-mini-2025-08-07 shut down"
summary: >
  Requests to the model gpt-5-mini-2025-08-07 fail after the shutdown date.
  OpenAI recommends gpt-5.6-terra as the replacement.

affects:
  - kind: model
    match: "gpt-5-mini-2025-08-07"

announced: 2026-06-11
effective: 2026-12-11

sources:
  - kind: provider_page
    url: https://developers.openai.com/api/docs/deprecations
    observed: 2026-09-18

migration:
  replacement: "gpt-5.6-terra"
  guide: https://developers.openai.com/api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Re-run any evals, because output style and
    token usage differ between model generations.

status: active
