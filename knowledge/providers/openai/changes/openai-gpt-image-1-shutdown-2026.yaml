id: openai-gpt-image-1-shutdown-2026
provider: openai
kind: retired
severity: breaking
title: "gpt-image-1 shut down"
summary: >
  Requests to the model gpt-image-1 fail after the shutdown date.
  OpenAI recommends gpt-image-2 as the replacement.

affects:
  - kind: model
    match: "gpt-image-1"

announced: 2026-04-22
effective: 2026-10-23

sources:
  - kind: provider_page
    url: https://developers.openai.com/api/docs/deprecations
    observed: 2026-09-18

migration:
  replacement: "gpt-image-2"
  guide: https://developers.openai.com/api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Re-run any evals, because output style and
    token usage differ between model generations.

status: active
