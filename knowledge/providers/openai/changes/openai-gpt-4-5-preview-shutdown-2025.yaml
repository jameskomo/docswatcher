id: openai-gpt-4-5-preview-shutdown-2025
provider: openai
kind: retired
severity: breaking
title: "gpt-4.5-preview shut down"
summary: >
  Requests to the model gpt-4.5-preview fail after the shutdown date.
  OpenAI recommends gpt-4.1 as the replacement.

affects:
  - kind: model
    match: "gpt-4.5-preview"

announced: 2025-04-14
effective: 2025-07-14

sources:
  - kind: provider_page
    url: https://developers.openai.com/api/docs/deprecations
    observed: 2026-09-18

migration:
  replacement: "gpt-4.1"
  guide: https://developers.openai.com/api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Re-run any evals, because output style and
    token usage differ between model generations.

status: expired
