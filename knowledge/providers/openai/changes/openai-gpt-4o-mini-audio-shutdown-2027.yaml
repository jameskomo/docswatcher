id: openai-gpt-4o-mini-audio-shutdown-2027
provider: openai
kind: retired
severity: breaking
title: "gpt-4o-mini-audio shut down"
summary: >
  Requests to the model gpt-4o-mini-audio fail after the shutdown date.
  OpenAI recommends gpt-audio-1.5 as the replacement.

affects:
  - kind: model
    match: "gpt-4o-mini-audio"

announced: 2026-07-20
effective: 2027-01-20

sources:
  - kind: provider_page
    url: https://developers.openai.com/api/docs/deprecations
    observed: 2026-09-23

migration:
  replacement: "gpt-audio-1.5"
  guide: https://developers.openai.com/api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Re-run any evals, because output style and
    token usage differ between model generations.

status: active
