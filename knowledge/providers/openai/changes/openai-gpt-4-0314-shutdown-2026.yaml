id: openai-gpt-4-0314-shutdown-2026
provider: openai
kind: retired
severity: breaking
title: "gpt-4-0314 shut down"
summary: >
  Requests to the model gpt-4-0314 fail after the shutdown date.
  OpenAI recommends gpt-5 as the replacement.

affects:
  - kind: model
    match: "gpt-4-0314"

announced: 2025-09-26
effective: 2026-03-26

sources:
  - kind: provider_page
    url: https://developers.openai.com/api/docs/deprecations
    observed: 2026-09-18

migration:
  replacement: "gpt-5"
  guide: https://developers.openai.com/api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Re-run any evals, because output style and
    token usage differ between model generations.

status: expired
