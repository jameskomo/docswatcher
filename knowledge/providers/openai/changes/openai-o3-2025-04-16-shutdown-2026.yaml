title: "o3-2025-04-16 shut down"
summary: >
  Requests to the model o3-2025-04-16 fail after the shutdown date.
  OpenAI recommends gpt-5.6-sol as the replacement.

affects:
  - kind: model
    match: "o3-2025-04-16"

announced: 2026-06-11
effective: 2026-12-11

sources:
