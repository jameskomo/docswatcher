  - id: cohere.typescript.generate
    language: typescript
    kind: sdk_method
    requires: cohere-ai
    query: |
      (call_expression
        function: (member_expression property: (property_identifier) @m)
        arguments: (arguments (object [(pair key: (property_identifier) @k) (shorthand_property_identifier) @k]))
        (#eq? @m "generate") (#eq? @k "prompt")) @call
    key: "CohereClient.generate"
    maps_to:
      kind: endpoint
      key: "POST /v1/generate"
    confidence: high

