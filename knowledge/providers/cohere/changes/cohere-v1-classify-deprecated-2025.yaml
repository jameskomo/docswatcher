id: cohere-v1-classify-deprecated-2025
provider: cohere
kind: sunset
severity: warning
title: "/v1/classify endpoint deprecated"
summary: >
  Cohere deprecated the /v1/classify endpoint effective September 15, 2025.
  Deprecated means it is no longer available to new customers and stays
  available to existing users until retirement; Cohere assigns a shutdown
  date later and none has been published, so requests still work for
  existing users today.

affects:
  - kind: endpoint
    match: "ANY /v1/classify"
  - kind: endpoint
    match: "POST /v1/classify"
  - kind: sdk_method
    match: "Client.classify"
  - kind: sdk_method
    match: "CohereClient.classify"

announced: 2025-09-15
effective: null

sources:
  - kind: provider_page
    url: https://docs.cohere.com/docs/deprecations
    observed: 2026-09-24
    note: "No shutdown date is published."
  - kind: changelog
    url: https://docs.cohere.com/changelog/2025-09-15-major-command-deprecations
    observed: 2026-09-24

migration:
  replacement: "none named by Cohere"
  guide: https://docs.cohere.com/docs/deprecations
  effort: medium
  notes: >
    Classify through the default Embed models is deprecated. Either train a
    classifier on embeddings from the embed endpoint
    (input_type=classification), or keep classify with a fine-tuned embed
    model, or move labelling into a chat prompt. Fine-tuning for classify is
    retired, so plan on embeddings or chat. Cohere names no replacement for
    this endpoint; the options above are the usual routes.

status: active
