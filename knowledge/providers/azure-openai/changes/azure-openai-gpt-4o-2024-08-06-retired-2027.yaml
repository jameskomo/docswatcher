id: azure-openai-gpt-4o-2024-08-06-retired-2027
provider: azure-openai
kind: retired
severity: breaking
title: "gpt-4o version 2024-08-06 retired"
summary: >
  Azure OpenAI retires gpt-4o version 2024-08-06 (lifecycle stage:
  Deprecated) on 2027-04-14. After that date inference requests to a
  deployment of that version return 410 Gone. Standard deployments set to
  upgrade automatically move to gpt-5.1; provisioned deployments are never
  upgraded and stop working.

affects:
  - kind: model
    match: "gpt-4o-2024-08-06"

announced: 2024-08-06
effective: 2027-04-14

sources:
  - kind: provider_page
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
    observed: 2026-09-24
    note: "Azure OpenAI table: gpt-4o | 2024-08-06 | Deprecated | 2027-04-14 | gpt-5.1. announced is the version date: Microsoft sets a model's retirement date when it launches."
  - kind: provider_page
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirements
    observed: 2026-09-24
    note: "Retired: Removed from service. All inference requests return 410 Gone. A GA model's retirement date is set when it launches."

migration:
  replacement: "gpt-5.1"
  guide: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
  effort: small
  notes: >
    Redeploy with model gpt-5.1 and update the model name and version in
    the deployment template (format OpenAI, name gpt-5.1), then point the
    deployment name the code uses at it. Check versionUpgradeOption on
    Standard deployments; provisioned deployments must be redeployed by
    hand. Re-run evals, because output and token usage differ between
    models.

status: active
