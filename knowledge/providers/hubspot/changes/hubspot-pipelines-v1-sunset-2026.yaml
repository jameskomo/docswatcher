id: hubspot-pipelines-v1-sunset-2026
provider: hubspot
kind: sunset
severity: breaking
title: "Pipelines API v1 sunset"
summary: >
  HubSpot sunsets the Pipelines API v1 on December 4, 2026. After that date
  calls to the v1 endpoints (/crm-pipelines/v1/pipelines/...) stop working.

affects:
  - kind: endpoint
    match: "ANY /crm-pipelines/v1/pipelines"
  - kind: endpoint
    match: "ANY /crm-pipelines/v1/pipelines/*"
  - kind: endpoint
    match: "ANY /crm-pipelines/v1/pipelines/*/*"

announced: 2026-08-14
effective: 2026-12-04

sources:
  - kind: changelog
    url: https://developers.hubspot.com/changelog/pipelines-api-v1-sunset
    observed: 2026-09-24

migration:
  replacement: "Pipelines API 2026-09"
  guide: https://developers.hubspot.com/docs/api-reference/latest/crm/pipelines/guide
  effort: medium
  notes: >
    Replace /crm-pipelines/v1/pipelines/{object_type} calls with the
    date-versioned Pipelines API (2026-09, generally available September 9,
    2026; 2026-03 is the minimum HubSpot names). Compare request and
    response shapes endpoint by endpoint against the API reference, since
    the v1 pipeline and stage objects differ from the current ones, and
    update any code that reads stage metadata or display order.

status: active
