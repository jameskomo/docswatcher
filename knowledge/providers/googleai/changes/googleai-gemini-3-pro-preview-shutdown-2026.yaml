id: googleai-gemini-3-pro-preview-shutdown-2026
provider: googleai
kind: retired
severity: breaking
title: "gemini-3-pro-preview shut down"
summary: >
  Requests naming the model gemini-3-pro-preview fail after the shutdown date.
  Google recommends gemini-3.1-pro-preview as the replacement.

affects:
  - kind: model
    match: "gemini-3-pro-preview"

announced: 2025-11-18
effective: 2026-03-09

sources:
  - kind: provider_page
    url: https://ai.google.dev/gemini-api/docs/deprecations
    observed: 2026-09-19

migration:
  replacement: "gemini-3.1-pro-preview"
  guide: https://ai.google.dev/gemini-api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. This was a preview model, so the stable
    release it preceded is the replacement and request and response shapes are
    unchanged in the common case. Re-run evals: preview and stable checkpoints
    do not produce identical output.

status: expired
