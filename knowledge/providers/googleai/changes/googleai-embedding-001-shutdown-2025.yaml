id: googleai-embedding-001-shutdown-2025
provider: googleai
kind: retired
severity: breaking
title: "embedding-001 shut down"
summary: >
  Requests naming the model embedding-001 fail after the shutdown date.
  Google recommends gemini-embedding-2 as the replacement.

affects:
  - kind: model
    match: "embedding-001"

announced: 2024-04-09
effective: 2025-10-30

sources:
  - kind: provider_page
    url: https://ai.google.dev/gemini-api/docs/deprecations
    observed: 2026-09-19

migration:
  replacement: "gemini-embedding-2"
  guide: https://ai.google.dev/gemini-api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Embedding dimensionality differs between
    models, so stored vectors must be regenerated and any vector index rebuilt
    before switching reads over. This is not a drop-in swap.

status: expired
