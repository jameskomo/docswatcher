id: googleai-gemini-2-5-flash-image-shutdown-2026
provider: googleai
kind: retired
severity: breaking
title: "gemini-2.5-flash-image shut down"
summary: >
  Requests naming the model gemini-2.5-flash-image fail after the shutdown date.
  Google recommends gemini-3.1-flash-image-preview as the replacement.

affects:
  - kind: model
    match: "gemini-2.5-flash-image"

announced: 2025-10-02
effective: 2026-10-02

sources:
  - kind: provider_page
    url: https://ai.google.dev/gemini-api/docs/deprecations
    observed: 2026-09-19

migration:
  replacement: "gemini-3.1-flash-image-preview"
  guide: https://ai.google.dev/gemini-api/docs/deprecations
  effort: small
  notes: >
    Replace the model ID string. Output style, latency and token usage differ
    between model generations, so re-run any evals and check assertions that
    depend on response length.

status: active
