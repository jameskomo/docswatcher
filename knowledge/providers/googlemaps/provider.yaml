sdk_languages: [javascript, typescript, python, java, go]
deprecation_policy: >
  A deprecation period, typically twelve months, starts on the announcement
  date and ends with decommissioning. Before that, services can move to Legacy
  status: feature frozen, closed to new Cloud projects, still fully supported,
  and decommissioned only after at least twelve months' notice. In the Maps
  JavaScript API a deprecated feature lives as long as its maximum supporting
  version, and removals ship in a quarterly release. The deprecations and
  legacy pages list every event; the JavaScript release notes carry the
  version and date of each removal.
