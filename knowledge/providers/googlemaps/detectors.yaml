provider: googlemaps

manifests:
  - ecosystem: npm
    package: "@googlemaps/js-api-loader"
  - ecosystem: npm
    package: "@googlemaps/google-maps-services-js"
  - ecosystem: npm
    package: "@types/google.maps"
  - ecosystem: pypi
    package: googlemaps
  - ecosystem: maven
    package: com.google.maps:google-maps-services
  - ecosystem: go
    package: googlemaps.github.io/maps

literals:
  # Maps web services. The host is Maps-only, so any path under it belongs to
  # this provider. The key keeps the output format segment, for example
  # "ANY /maps/api/place/nearbysearch/json". Places API (New) and the Routes API
  # live on places.googleapis.com and routes.googleapis.com and are not matched.
  - id: googlemaps.literal.web-service-endpoint
    kind: endpoint
    files: ["**/*.{java,kt,ts,tsx,js,jsx,mjs,cjs,py,go,rb,php,cs,swift,dart,html,htm,vue,svelte,yaml,yml,toml,properties,env}"]
    exclude: ["**/node_modules/**", "**/target/**", "**/dist/**"]
    pattern: 'https://maps\.googleapis\.com(/maps/api/[a-z]+(?:/[a-z]+)*)'
    key: "ANY $1"
    confidence: medium

  # Maps JavaScript API classes that a change record names, constructed through
  # the global google.maps namespace, which is how the script-tag loader and
  # @googlemaps/js-api-loader expose them. Only the listed names are matched, so
  # the inventory is not filled with every Map and LatLng. Classes obtained
  # through importLibrary() and constructed by a bare name are not seen.
  # Add a name here in the same change that adds its record.
  - id: googlemaps.literal.js-class
    kind: sdk_method
    files: ["**/*.{js,jsx,mjs,cjs,ts,tsx,html,htm,vue,svelte}"]
    exclude: ["**/node_modules/**", "**/dist/**", "**/*.d.ts"]
    pattern: '\bnew\s+google\.maps\.(Marker|DirectionsService|DirectionsRenderer|DistanceMatrixService|KmlLayer|places\.PlacesService|visualization\.HeatmapLayer|drawing\.DrawingManager)\s*\('
    key: "google.maps.$1"
    confidence: medium

  - id: googlemaps.literal.js-dom-listener
    kind: sdk_method
    files: ["**/*.{js,jsx,mjs,cjs,ts,tsx,html,htm,vue,svelte}"]
    exclude: ["**/node_modules/**", "**/dist/**", "**/*.d.ts"]
    pattern: '\bgoogle\.maps\.event\.(addDomListener(?:Once)?)\s*\('
    key: "google.maps.event.$1"
    confidence: medium

# Web service clients. The Node client always takes one object with a params
# member, which the TypeScript and JavaScript rules require.
callsites:

  - id: googlemaps.python.directions
    language: python
    kind: sdk_method
    requires: googlemaps
    query: |
      (call
        function: (attribute attribute: (identifier) @m)
        (#eq? @m "directions")) @call
    key: "Client.directions"
    maps_to:
      kind: endpoint
      key: "GET /maps/api/directions/json"
    confidence: high

  - id: googlemaps.python.distance-matrix
