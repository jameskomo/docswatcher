id: mistral-medium-2508-retired-2026
provider: mistral
kind: retired
severity: breaking
title: "mistral-medium-2508 retired"
summary: >
  Mistral deprecated mistral-medium-2508 on 2026-05-22 and retired it on
  2026-08-31. Requests naming it now fail with 404. Mistral names Mistral
  Medium 3.5 (mistral-medium-3-5) as the alternative.

affects:
  - kind: model
    match: "mistral-medium-2508"

announced: 2026-05-22
effective: 2026-08-31

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: mistral-medium-2508, deprecation 5/22/2026, retirement 8/31/2026, alternative Mistral Medium 3.5."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-medium-3-5"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string mistral-medium-2508 with
    mistral-medium-3-5, or with that family's -latest alias if the code
    should follow future releases. Re-run evals and any tests that assert
    on output, because output style, context length and token usage differ
    between model generations.

status: expired
