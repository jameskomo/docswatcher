id: mistral-large-2407-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "mistral-large-2407 retired"
summary: >
  Mistral deprecated mistral-large-2407 on 2024-11-30 and retired it on
  2025-03-30. Requests naming it now fail with 404. Mistral names Mistral
  Large 3 (mistral-large-2512) as the alternative.

affects:
  - kind: model
    match: "mistral-large-2407"

announced: 2024-11-30
effective: 2025-03-30

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: mistral-large-2407, deprecation 11/30/2024, retirement 3/30/2025, alternative Mistral Large 3."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-large-2512"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string mistral-large-2407 with
    mistral-large-2512, or with that family's -latest alias if the code
    should follow future releases. Re-run evals and any tests that assert
    on output, because output style, context length and token usage differ
    between model generations.

status: expired
