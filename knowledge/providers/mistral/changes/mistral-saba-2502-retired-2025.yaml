id: mistral-saba-2502-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "mistral-saba-2502 retired"
summary: >
  Mistral deprecated mistral-saba-2502 on 2025-06-10 and retired it on
  2025-09-30. Requests naming it now fail with 404. Mistral names Mistral
  Small 4 (mistral-small-2603) as the alternative.

affects:
  - kind: model
    match: "mistral-saba-2502"

announced: 2025-06-10
effective: 2025-09-30

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: mistral-saba-2502, deprecation 6/10/2025, retirement 9/30/2025, alternative Mistral Small 4."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-small-2603"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string mistral-saba-2502 with mistral-small-2603,
    or with that family's -latest alias if the code should follow future
    releases. Re-run evals and any tests that assert on output, because
    output style, context length and token usage differ between model
    generations.

status: expired
