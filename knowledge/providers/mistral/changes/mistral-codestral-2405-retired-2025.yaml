id: mistral-codestral-2405-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "codestral-2405 retired"
summary: >
  Mistral deprecated codestral-2405 on 2024-12-02 and retired it on
  2025-06-16. Requests naming it now fail with 404. Mistral names Codestral
  (codestral-2508) as the alternative.

affects:
  - kind: model
    match: "codestral-2405"

announced: 2024-12-02
effective: 2025-06-16

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: codestral-2405, deprecation 12/2/2024, retirement 6/16/2025, alternative Codestral."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "codestral-2508"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string codestral-2405 with codestral-2508, or
    with that family's -latest alias if the code should follow future
    releases. Re-run evals and any tests that assert on output, because
    output style, context length and token usage differ between model
    generations.

status: expired
