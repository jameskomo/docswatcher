id: mistral-magistral-small-2509-retired-2026
provider: mistral
kind: retired
severity: breaking
title: "magistral-small-2509 retired"
summary: >
  Mistral deprecated magistral-small-2509 on 2026-04-30 and retired it on
  2026-07-31. Requests naming it now fail with 404. Mistral names Mistral
  Small 4 (mistral-small-2603) as the alternative.

affects:
  - kind: model
    match: "magistral-small-2509"

announced: 2026-04-30
effective: 2026-07-31

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: magistral-small-2509, deprecation 4/30/2026, retirement 7/31/2026, alternative Mistral Small 4."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-small-2603"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string magistral-small-2509 with
    mistral-small-2603, or with that family's -latest alias if the code
    should follow future releases. Re-run evals and any tests that assert
    on output, because output style, context length and token usage differ
    between model generations.

status: expired
