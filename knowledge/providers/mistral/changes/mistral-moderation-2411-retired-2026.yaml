id: mistral-moderation-2411-retired-2026
provider: mistral
kind: retired
severity: breaking
title: "mistral-moderation-2411 retired"
summary: >
  Mistral deprecated mistral-moderation-2411 on 2026-03-31 and retired it on
  2026-06-30. Requests naming it now fail with 404. Mistral names Mistral
  Moderation 2 (mistral-moderation-2603) as the alternative.

affects:
  - kind: model
    match: "mistral-moderation-2411"

announced: 2026-03-31
effective: 2026-06-30

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: mistral-moderation-2411, deprecation 3/31/2026, retirement 6/30/2026, alternative Mistral Moderation 2."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-moderation-2603"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string mistral-moderation-2411 with
    mistral-moderation-2603, or with that family's -latest alias if the
    code should follow future releases. Re-run evals and any tests that
    assert on output, because output style, context length and token usage
    differ between model generations.

status: expired
