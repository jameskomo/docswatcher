id: mistral-open-mixtral-8x7b-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "open-mixtral-8x7b retired"
summary: >
  Mistral deprecated open-mixtral-8x7b on 2024-11-30 and retired it on
  2025-03-30. Requests naming it now fail with 404. Mistral names Mistral
  Small 4 (mistral-small-2603) as the alternative.

affects:
  - kind: model
    match: "open-mixtral-8x7b"

announced: 2024-11-30
effective: 2025-03-30

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: open-mixtral-8x7b, deprecation 11/30/2024, retirement 3/30/2025, alternative Mistral Small 4."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-small-2603"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string open-mixtral-8x7b with mistral-small-2603,
    or with that family's -latest alias if the code should follow future
    releases. Re-run evals and any tests that assert on output, because
    output style, context length and token usage differ between model
    generations.

status: expired
