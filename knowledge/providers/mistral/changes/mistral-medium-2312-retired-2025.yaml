id: mistral-medium-2312-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "mistral-medium-2312 retired"
summary: >
  Mistral deprecated mistral-medium-2312 on 2024-11-30 and retired it on
  2025-06-16. Requests naming it now fail with 404. Mistral names Mistral
  Medium 3.5 (mistral-medium-3-5) as the alternative.

affects:
  - kind: model
    match: "mistral-medium-2312"

announced: 2024-11-30
effective: 2025-06-16

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: mistral-medium-2312, deprecation 11/30/2024, retirement 6/16/2025, alternative Mistral Medium 3.5."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-medium-3-5"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string mistral-medium-2312 with
    mistral-medium-3-5, or with that family's -latest alias if the code
    should follow future releases. Re-run evals and any tests that assert
    on output, because output style, context length and token usage differ
    between model generations.

status: expired
