id: mistral-ocr-2503-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "mistral-ocr-2503 retired"
summary: >
  Mistral deprecated mistral-ocr-2503 on 2025-12-02 and retired it on
  2025-12-31. Requests naming it now fail with 404. Mistral names OCR 4.1
  (mistral-ocr-4-1) as the alternative.

affects:
  - kind: model
    match: "mistral-ocr-2503"

announced: 2025-12-02
effective: 2025-12-31

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: mistral-ocr-2503, deprecation 12/2/2025, retirement 12/31/2025, alternative OCR 4.1."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "mistral-ocr-4-1"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string mistral-ocr-2503 with mistral-ocr-4-1, or
    with that family's -latest alias if the code should follow future
    releases. Re-run evals and any tests that assert on output, because
    output style, context length and token usage differ between model
    generations.

status: expired
