id: mistral-open-mistral-7b-retired-2025
provider: mistral
kind: retired
severity: breaking
title: "open-mistral-7b retired"
summary: >
  Mistral deprecated open-mistral-7b on 2024-11-30 and retired it on
  2025-03-30. Requests naming it now fail with 404. Mistral names Ministral
  3 8B (ministral-8b-2512) as the alternative.

affects:
  - kind: model
    match: "open-mistral-7b"

announced: 2024-11-30
effective: 2025-03-30

sources:
  - kind: provider_page
    url: https://docs.mistral.ai/models
    observed: 2026-09-24
    note: "Deprecated & retired models table: open-mistral-7b, deprecation 11/30/2024, retirement 3/30/2025, alternative Ministral 3 8B."
  - kind: provider_page
    url: https://docs.mistral.ai/inference/model-lifecycle
    observed: 2026-09-24
    note: "Once retired, requests to its identifiers fail with a 404 error."

migration:
  replacement: "ministral-8b-2512"
  guide: https://docs.mistral.ai/models
  effort: small
  notes: >
    Replace the model ID string open-mistral-7b with ministral-8b-2512, or
    with that family's -latest alias if the code should follow future
    releases. Re-run evals and any tests that assert on output, because
    output style, context length and token usage differ between model
    generations.

status: expired
