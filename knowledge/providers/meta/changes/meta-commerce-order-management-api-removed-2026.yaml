id: meta-commerce-order-management-api-removed-2026
provider: meta
kind: sunset
severity: breaking
title: "Commerce Order Management API removed"
summary: >
  The Commerce Order Management API, 47 endpoints including a Page's
  commerce_orders edge, is blocked on v26.0 and later since 2026-07-29 and
  removed from all remaining versions on 2026-10-27. No replacement API is
  available.

affects:
  - kind: endpoint
    match: "GET /{page-id}/commerce_orders"

announced: 2026-07-29
effective: 2026-10-27

sources:
  - kind: changelog
    url: https://developers.facebook.com/docs/graph-api/changelog/version26.0
    observed: 2026-09-24
    note: "Commerce Order Management API deprecation: Calls on v26.0 and later are blocked beginning July 29, 2026. The affected surfaces are removed from all remaining versions on October 27, 2026. No replacement API is available."

migration:
  replacement: null
  guide: https://developers.facebook.com/docs/graph-api/changelog/version26.0
  effort: large
  notes: >
    There is no replacement API. Remove order sync that reads GET
    /{page-id}/commerce_orders and the order, shipment and refund edges,
    and move order management to the commerce platform that takes the
    orders. Make the code tolerate errors from these edges until it is
    removed.

status: active
