id: meta-graph-api-v21-0-expires-2027
provider: meta
kind: sunset
severity: breaking
title: "Graph API v21.0 expires"
summary: >
  Graph API v21.0 stops being usable on 2027-01-21. Calls that still name
  v21.0 are then served by the oldest version still available, so they do
  not fail, but fields and edges removed since then disappear from responses
  without an error.

affects:
  - kind: api_version
    match: "v21.0"

announced: 2024-10-02
effective: 2027-01-21

sources:
  - kind: provider_page
    url: https://developers.facebook.com/docs/graph-api/changelog/versions/
    observed: 2026-09-24
    note: "Graph API table: v21.0 | October 2, 2024 | January 21, 2027. announced is the release date."
  - kind: provider_page
    url: https://developers.facebook.com/docs/graph-api/guides/versioning
    observed: 2026-09-24
    note: "Once a version is no longer usable, any calls made to it will be defaulted to the next oldest, usable version."

migration:
  replacement: "v26.0"
  guide: https://developers.facebook.com/docs/graph-api/changelog
  effort: medium
  notes: >
    Change the version segment of every graph.facebook.com URL from v21.0
    to a current version, along with any FB.init({ version }) and SDK
    api_version setting. Read the changelog of every version in between
    for removed fields, edges and permissions, and update response parsing
    that relies on them. The app dashboard's default API version governs
    unversioned calls, so upgrade it too.

status: active
