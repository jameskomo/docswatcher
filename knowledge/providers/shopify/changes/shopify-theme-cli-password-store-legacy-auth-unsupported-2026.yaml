id: shopify-theme-cli-password-store-legacy-auth-unsupported-2026
provider: shopify
kind: sunset
severity: warning
title: "Theme CLI 3.83.x and older stop working on password-protected storefronts"
summary: >
  From 23 September 2026, Theme commands on Shopify CLI require version 3.84.0
  or later when the storefront is password protected. Versions 3.83.x and
  earlier use a legacy storefront authentication that is no longer supported
  for theme development flows on password-protected stores. Stores without
  password protection are unaffected.

affects:
  - kind: sdk_package
    match: "@shopify/cli"

announced: 2026-08-27
effective: 2026-09-23

sources:
  - kind: changelog
    url: https://shopify.dev/changelog/password-protected-shop-dev-flows-on-shopify-theme-cli-v3-83-x-and-older-to-be-deprecated
    observed: 2026-09-26

migration:
  replacement: "Shopify CLI 3.84.0 or later"
  guide: https://shopify.dev/changelog/password-protected-shop-dev-flows-on-shopify-theme-cli-v3-83-x-and-older-to-be-deprecated
  effort: small
  notes: >
    Upgrade the CLI before 23 September 2026, or remove the storefront
    password to keep using an older version.

status: expired
